name: birdwrite
description: "A notetaking app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  saf: ^2.1.0
  open_filex: ^4.5.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  intl: ^0.20.2
  flutter_markdown_plus: ^1.0.5
  flutter_quill: ^11.0.0
  dart_quill_delta: ^10.8.3
  markdown_quill: ^4.3.0
  markdown: ^7.2.2
  google_fonts: ^8.2.1
  perfect_freehand: ^2.5.2
  flutter_lucide: ^1.0.0
  pdfx: ^2.6.0
  path: ^1.9.0
  pdf: ^3.13.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.3
  lucide_icons_flutter: ^3.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - BirdWrite.png

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "BirdWrite.png"
  min_sdk_android: 21
